[project]
name = "rag-app"
version = "0.1.0"
description = "Modular, evaluation-driven Retrieval-Augmented Generation (RAG) system."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are added only in the milestone that needs them.
dependencies = [
    "chromadb>=1.5.9",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.2",
    "sentence-transformers>=6.2.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: slow tests that load real models (first run downloads them)",
]
# Integration tests are skipped by default; run them with: pytest -m integration
addopts = "-m 'not integration'"
